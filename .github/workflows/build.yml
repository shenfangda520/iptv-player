name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'IPTV Player ${{ github.ref_name }}'
          releaseBody: 'See the assets below for downloadable builds.'
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci --skip-targets-install
          fi

      - name: Allow IPTV HTTP streams
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("src-tauri/gen/android/app/build.gradle.kts")
          text = gradle.read_text()
          release = '        getByName("release") {\n'
          cleartext = '            manifestPlaceholders["usesCleartextTraffic"] = "true"\n'
          if cleartext not in text:
              text = text.replace(release, release + cleartext)
          gradle.write_text(text)
          PY

      - name: Enable Android immersive fullscreen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          activity = Path("src-tauri/gen/android/app/src/main/java/com/shenfangda/iptvplayer/MainActivity.kt")
          activity.write_text(dedent("""\
          package com.shenfangda.iptvplayer

          import android.os.Bundle
          import android.view.View
          import androidx.activity.enableEdgeToEdge
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : TauriActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              enableEdgeToEdge()
              super.onCreate(savedInstanceState)
              enterImmersiveMode()
            }

            override fun onWindowFocusChanged(hasFocus: Boolean) {
              super.onWindowFocusChanged(hasFocus)
              if (hasFocus) enterImmersiveMode()
            }

            private fun enterImmersiveMode() {
              WindowCompat.setDecorFitsSystemWindows(window, false)
              WindowInsetsControllerCompat(window, window.decorView).let { controller ->
                controller.hide(WindowInsetsCompat.Type.systemBars())
                controller.systemBarsBehavior =
                  WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              @Suppress("DEPRECATION")
              window.decorView.systemUiVisibility =
                View.SYSTEM_UI_FLAG_FULLSCREEN or
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
              View.SYSTEM_UI_FLAG_LAYOUT_STABLE
            }
          }
          """))
          PY

      - name: Sync frontend assets
        run: |
          rsync -a src/ src-tauri/gen/android/app/src/main/assets/

      - name: Tune Gradle memory
        run: |
          PROPS="src-tauri/gen/android/gradle.properties"
          # Ensure trailing newline before appending
          [ -n "$(tail -c1 "$PROPS")" ] && echo >> "$PROPS"
          cat >> "$PROPS" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: Build Android APK
        run: npx tauri android build --apk --ci --target aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign Android APK
        run: |
          keytool -genkeypair \
            -keystore /tmp/iptv-release.keystore \
            -storepass iptvplayer \
            -keypass iptvplayer \
            -alias iptv \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=shenfangda, OU=IPTV, O=shenfangda, L=Shanghai, S=Shanghai, C=CN"
          unsigned_apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -n 1)"
          aligned_apk="${unsigned_apk%-unsigned.apk}-aligned.apk"
          signed_apk="${unsigned_apk%-unsigned.apk}-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/iptv-release.keystore \
            --ks-key-alias iptv \
            --ks-pass pass:iptvplayer \
            --key-pass pass:iptvplayer \
            --out "$signed_apk" \
            "$aligned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$signed_apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*-signed.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*-signed.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
